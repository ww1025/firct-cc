<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>物资仓库 — 国旗仪仗队</title>
<style>
:root {
  --flag-red: #B81616; --flag-red-dark: #8E1010;
  --gold: #F5C518;
  --green-900: #0f2518; --green-700: #1a3a2a; --green-500: #2d5a3f;
  --cream: #F5F1E6; --white: #FFFFFF;
  --ink: #2c1810; --ink-light: #5c4a3a; --ink-faint: #9c8a7a;
  --font-heading: 'SimSun','KaiTi','宋体','楷体','Microsoft YaHei',serif;
  --font-body: 'Microsoft YaHei','PingFang SC',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:15px/1.8 var(--font-body);color:var(--ink);background:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--flag-red)}50%{box-shadow:0 0 0 5px var(--flag-red),0 0 16px rgba(184,22,22,.4)}}

.header{background:var(--flag-red);color:var(--white);padding:16px 20px;position:sticky;top:0;z-index:50;animation:fadeInDown .8s ease-out;border-bottom:2px solid rgba(245,197,24,.3);display:flex;align-items:center;gap:16px}
.header .back{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;letter-spacing:.05em;transition:color .15s;flex-shrink:0}
.header .back:hover{color:var(--gold)}
.header .hd-main{flex:1}
.header h1{font-family:var(--font-heading);font-size:1rem;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.header .sub{font-size:.65rem;color:rgba(255,255,255,.65);margin-top:1px;letter-spacing:.04em}
.header .header-star{color:var(--gold);font-size:12px}

.search-row{display:flex;gap:6px;margin-top:8px;position:relative}
.search-row input{flex:1;padding:10px 12px;border:none;border-radius:8px;font-size:.85rem;outline:none;background:var(--white);min-width:0;font-family:var(--font-body);color:var(--ink)}
.search-row input::placeholder{color:var(--ink-faint)}
.search-row input:focus{box-shadow:0 0 0 2px var(--gold)}
.search-row button{padding:10px 16px;border:none;border-radius:8px;background:var(--flag-red-dark);color:var(--white);font-weight:700;cursor:pointer;font-size:.85rem;white-space:nowrap;font-family:var(--font-heading);letter-spacing:.05em;transition:all .2s}
.search-row button:hover{background:var(--flag-red);box-shadow:0 2px 8px rgba(184,22,22,.2)}
.suggestions{position:absolute;top:44px;left:0;right:0;background:var(--white);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:100;max-height:180px;overflow-y:auto;display:none;font-size:.8rem;border:1px solid rgba(184,22,22,.1)}
.suggestions .item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--cream)}
.suggestions .item:hover{background:rgba(245,197,24,.08)}

.main{padding:8px}

.section{margin-bottom:12px;background:var(--white);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.03);overflow:hidden;border:1px solid rgba(184,22,22,.08);border-left:3px solid var(--gold);animation:fadeInUp .7s ease-out both}
.section:nth-child(1){animation-delay:.1s}
.section:nth-child(2){animation-delay:.2s}
.section:nth-child(3){animation-delay:.3s}
.section-header{padding:10px 14px;font-size:.8rem;font-weight:700;border-bottom:2px solid rgba(184,22,22,.12);display:flex;align-items:center;gap:8px;background:var(--white);font-family:var(--font-heading);letter-spacing:.05em;color:var(--green-900)}
.section-header .tag{padding:3px 10px;border-radius:4px;color:var(--white);font-size:.65rem;font-weight:600;letter-spacing:.04em}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px}
.grid-table{display:grid;gap:2px;padding:2px}

.cell{border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;min-width:70px;min-height:50px;cursor:pointer;transition:all .15s;text-align:center;border:1px solid transparent;-webkit-tap-highlight-color:transparent}
.cell:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.cell:active{transform:scale(.95)}
.cell.hl{border-color:var(--flag-red)!important;box-shadow:0 0 0 2px var(--flag-red),0 0 12px rgba(184,22,22,.3)!important;z-index:10;animation:glow .8s ease infinite}
.cell.empty{background:#fafaf7;border-color:#e8e4de;cursor:default}
.cell.empty:hover{transform:none;box-shadow:none}
.cell.empty:active{transform:none}
.cell .cc{font-weight:700;font-size:.68rem;margin-bottom:2px}
.cell .cn{font-size:.6rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-light)}
.cell .ct{font-size:.5rem;color:var(--white);padding:1px 4px;border-radius:2px;margin-top:1px}
.cell.gh{min-width:auto;min-height:22px;padding:2px 3px;font-size:.65rem}
.cell.gh:hover{transform:none;box-shadow:none}
.cell.gh:active{transform:none}

.cell.boot{background:#FFF3E0;border-color:#FFE0B2}.cell.boot .cc{color:#BF360C}
.cell.belt{background:#FCE4EC;border-color:#F8BBD0}.cell.belt .cc{color:#880E4F}
.cell.uniform{background:#E3F2FD;border-color:#BBDEFB}.cell.uniform .cc{color:#0D47A1}

.cab-label{font-size:.65rem;font-weight:700;padding:3px 10px;border-left:3px solid;margin:4px 0 2px;font-family:var(--font-heading);letter-spacing:.04em}

.panel{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-radius:12px 12px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.15);padding:16px;z-index:60;max-height:50vh;overflow-y:auto;display:none;border-top:3px solid var(--flag-red)}
.panel.show{display:block}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panel .ph h3{font-size:.85rem;color:var(--flag-red);font-family:var(--font-heading);letter-spacing:.05em}
.panel .pc{font-size:.78rem;line-height:2;color:var(--ink-light)}
.panel .pc strong{color:var(--ink)}
.panel .close{font-size:1.2rem;color:var(--ink-faint);cursor:pointer;padding:4px 8px;background:none;border:none;transition:color .15s}
.panel .close:hover{color:var(--flag-red)}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:55;display:none}
.overlay.show{display:block}

.tip{text-align:center;color:var(--ink-faint);font-size:.65rem;padding:8px;letter-spacing:.04em}

footer{text-align:center;padding:28px;font-family:var(--font-heading);font-size:12px;color:var(--green-700);letter-spacing:.06em;position:relative;z-index:1;border-top:1px solid rgba(184,22,22,.08)}
footer .footer-star{color:var(--gold);font-size:10px;margin:0 6px}
</style>
</head>

<div class="header">

  <div class="hd-main">
    <h1><span class="header-star">&#9733;</span> 物资仓库</h1>
    <div class="sub">马靴 · 腰带 · 礼服 存放位置</div>
  </div>
  <div class="search-row">
    <input type="text" id="q" placeholder="搜索库位/姓名/尺码..." oninput="si()">

</div>

<footer><span class="footer-star">&#9733;</span> 浙江大学国旗仪仗队 &copy; 2026 <span class="footer-star">&#9733;</span></footer>

function fmtName(nm){if(!nm)return'';var p=nm.split(/[\/,，、]/).filter(function(x){return x.trim()});return p.length>1?p.length+'人':p[0].trim()}

function buildBoots(){
  var flat=[];D.grid.forEach(function(r){r.forEach(function(c){if(c&&c.code)flat.push(c)})});
  var cg=[{n:1,c:4},{n:2,c:4},{n:3,c:3},{n:4,c:3}],rg=[{n:'A',r:2},{n:'B',r:4},{n:'C',r:5}];
  var h='<div class="section"><div class="section-header"><span class="tag" style="background:#E65100">🥾</span>马靴 · '+flat.length+'库位</div><div class="table-wrap"><div class="grid-table" style="grid-template-columns:28px repeat(14,minmax(64px,1fr))">';
  h+='<div class="cell gh" style="background:#fafafa"></div>';
  cg.forEach(function(g){h+='<div class="cell gh" style="grid-column:span '+g.c+';background:var(--green-700);color:var(--gold);font-weight:700;font-family:var(--font-heading)">'+g.n+'</div>'});
  var ri=0;
  rg.forEach(function(rg2){
    D.grid.slice(ri,ri+rg2.r).forEach(function(row,lri){
      if(lri===0)h+='<div class="cell gh" style="grid-row:span '+rg2.r+';writing-mode:vertical-lr;background:var(--green-700);color:var(--gold);font-weight:700;font-family:var(--font-heading)">'+rg2.n+'</div>';

        var cell=(ci<row.length)?row[ci]:null;

    });ri+=rg2.r;

function buildSec(items,type,title,color){
  if(!items.length)return'';
  var cabs=['一柜','二柜','三柜','四柜','五柜','六柜'];
  var ccl=['#E65100','#FF8F00','#F9A825','#FFB300','#FFC107','#FFCA28'];
  var h='<div class="section"><div class="section-header"><span class="tag" style="background:'+color+'">'+title.substring(0,2)+'</span>'+title+' · '+items.length+'项</div><div class="table-wrap">';
  cabs.forEach(function(cab,ci){
    var grp=items.filter(function(it){return it.cabinet===cab});if(!grp.length)return;
    h+='<div class="cab-label" style="color:'+ccl[ci]+';border-color:'+ccl[ci]+'">'+cab+' · '+grp.length+'项</div>';
    h+='<div class="grid-table" style="grid-template-columns:repeat(auto-fill,minmax(80px,1fr))">';
    grp.forEach(function(item){
      var nm=item.person||'',st=(type==='uniform'&&SHIRT_SET[item.code])?'<span class="ct" style="background:var(--green-500)">衬衫</span>':'';

      if(nm)h+='<span class="cn">'+fmtName(nm)+'</span>';
      if(st)h+=st;
      h+='</div>';
    });h+='</div>';
  });h+='</div></div>';return h;
}

function indexDOM(){CM={};document.querySelectorAll('.cell[data-type]').forEach(function(el){var t=el.getAttribute('data-type'),c=el.getAttribute('data-code');CM[t+'_'+c]=el;el.addEventListener('click',function(){clearHL();if(t==='boot'){D.grid.forEach(function(r){r.forEach(function(cell){if(cell&&cell.code===c)openPanel('🥾 马靴 '+c,'📍 库位：<strong>'+c+'</strong><br>👤 '+(cell.person||'未分配'))})})}else if(t==='belt'){var b=D.belts.find(function(x){return x.code===c});if(b)openPanel('🎽 腰带 '+c,(c.indexOf('F')===0?'女款':'男款')+' · '+b.cabinet+'<br>👔 礼服尺码：<strong>'+(b.uniform_size||'-')+'</strong><br>👤 <strong>'+(b.person||'未分配')+'</strong>')}else{var u=D.uniforms.find(function(x){return x.code===c});if(u){var st2=SHIRT_SET[c]?' <span style="background:var(--green-500);color:#fff;padding:1px 6px;border-radius:3px;font-size:.65rem">有配套衬衫</span>':'';openPanel('👔 礼服 '+c+st2,'🏷️ '+u.cabinet+'<br>🎽 腰带：<strong>'+(u.belt||'-')+'</strong><br>👤 <strong>'+(u.person||'未分配')+'</strong>')}}el.classList.add('hl')})})}

function clearHL(){for(var k in CM)CM[k].classList.remove('hl')}

function si(){
  var q=document.getElementById('q').value.trim(),s=document.getElementById('sug');if(q.length<1){s.style.display='none';return}
  var ql=q.toLowerCase();
