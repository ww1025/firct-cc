let A={},S={},checkResults=[];

function initA(){
  A={};
  for(const p of PEOPLE){
    const b=BASE[p.name]||{},beltMap=p.sex==='F'?BELT_F:BELT_M;
    const d=b.礼服||'';A[p.name]={礼服:d,礼帽:b.礼帽||'',马靴:b.马靴||'',腰带:beltMap[d]||'',备注:'',changed:{}};
  }
  computeNotes();
}
function computeNotes(){
  for(const p of PEOPLE)A[p.name].备注='';
  function group(f){const m={};for(const p of PEOPLE){const v=A[p.name][f];if(!v)continue;if(!m[v])m[v]=[];m[v].push(p.name);}return m;}
  function add(n,t){if(!t)return;A[n].备注=A[n].备注?A[n].备注+'、'+t:t;}
  for(const[f,lb]of[['礼服','礼服'],['礼帽','礼帽'],['马靴','马靴']]){
    const g=group(f);
    for(const[eq,names]of Object.entries(g))if(names.length>1)for(const n of names)add(n,`和${names.filter(x=>x!==n).join('、')}共用${lb}`);
  }
}
function parseSched(text){
  const days=['周一','周二','周三','周四','周五'],r={};for(const d of days)r[d]=[];
  if(!text.trim())return r;
  for(const line of text.split('\n'))for(const d of days)if(line.includes(d)||line.includes(d.replace('周','星期'))){const p=line.split(/[：:]/);if(p.length>=2)r[d]=p[1].split(/[、，,\s]+/).map(s=>s.trim()).filter(Boolean);}
  return r;
}
function autoAllocate(){
  const usage={礼服:{},礼帽:{},马靴:{},腰带:{}};
  function ok(eq,f,dd){if(!eq)return true;const u=usage[f][eq]||[];if(u.length>=2)return false;for(const o of u)for(const d of dd)if((S[d]||[]).includes(o))return false;return true;}
  function pick(pool,f,dd){for(const eq of pool)if(ok(eq,f,dd))return eq;for(const eq of pool)if((usage[f][eq]||[]).length<2)return eq;return pool[0];}
  function dutyDays(n){const ds=[];for(const[d,ns]of Object.entries(S))if(ns.includes(n))ds.push(d);return ds;}
  const sorted=[...PEOPLE].sort((a,b)=>{const ad=dutyDays(a.name)?0:1,bd=dutyDays(b.name)?0:1;if(ad!==bd)return ad-bd;return a.cls-b.cls;});
  for(const p of sorted){
    const dd=dutyDays(p.name),isF=p.sex==='F',beltMap=isF?BELT_F:BELT_M;
    const dp=isF?DRESS_F:DRESS_M;let d=A[p.name].礼服;if(!d||!dp.includes(d)||!ok(d,'礼服',dd))d=pick(dp,'礼服',dd);
    const hp=isF?HAT_F:HAT_M;let h=A[p.name].礼帽;if(!h||!hp.includes(h)||!ok(h,'礼帽',dd))h=pick(hp,'礼帽',dd);
    let b=A[p.name].马靴;if(!b||!BOOTS.includes(b)||!ok(b,'马靴',dd))b=pick(BOOTS,'马靴',dd);
    const ch={},base=BASE[p.name]||{};if(d!==base.礼服&&base.礼服)ch.礼服=true;if(h!==base.礼帽&&base.礼帽)ch.礼帽=true;if(b!==base.马靴&&base.马靴)ch.马靴=true;
    A[p.name]={礼服:d,礼帽:h,马靴:b,腰带:beltMap[d]||'',备注:A[p.name].备注,changed:ch};
    for(const[f,v]of[['礼服',d],['礼帽',h],['马靴',b],['腰带',beltMap[d]||'']]){if(!v)continue;if(!usage[f][v])usage[f][v]=[];if(!usage[f][v].includes(p.name))usage[f][v].push(p.name);}
  }
  computeNotes();
}
function selfCheck(){
  const r=[],days=['周一','周二','周三','周四','周五'];let cc=0;
  for(const day of days){const names=S[day]||[];if(!names.length)continue;for(const f of['礼服','礼帽','马靴','腰带']){const em={};for(const n of names){const v=A[n]&&A[n][f];if(!v)continue;if(!em[v])em[v]=[];em[v].push(n);}for(const[eq,ns]of Object.entries(em))if(ns.length>1){cc++;r.push({ok:false,msg:`${day} ${ns.join('、')}共用${f}「${eq}」`});}}}
  r.push({ok:cc===0,msg:`1 每日装备冲突：${cc===0?'无冲突':'发现'+cc+'处冲突'}`});
  let be=0;for(const p of PEOPLE){const a=A[p.name];if(!a.礼服)continue;const bm=p.sex==='F'?BELT_F:BELT_M,ex=bm[a.礼服];if(ex&&a.腰带!==ex){be++;}}
  r.push({ok:be===0,msg:`2 礼服腰带绑定：${be===0?'全部正确':'发现'+be+'处错配'}`});
  let ne=0;function en(note){const ns=[];const re=/和([^共]+)共用/g;let m;while((m=re.exec(note))!==null)for(const s of m[1].split('、')){const t=s.trim();if(t)ns.push(t);}return ns;}
  for(const p of PEOPLE){const note=A[p.name].备注||'';for(const o of en(note)){if(!(A[o]||{}).备注||!(A[o].备注.includes(p.name)))ne++;}}
  r.push({ok:ne===0,msg:`3 共用关系双向：${ne===0?'全部完整':'发现'+ne+'处遗漏'}`});
  let ie=0;for(const p of PEOPLE){const a=A[p.name],isF=p.sex==='F';if(a.礼服&&!(isF?DRESS_F:DRESS_M).includes(a.礼服))ie++;if(a.礼帽&&!(isF?HAT_F:HAT_M).includes(a.礼帽))ie++;if(a.马靴&&!BOOTS.includes(a.马靴))ie++;}
  r.push({ok:ie===0,msg:`4 装备编号合法：${ie===0?'全部有效':'发现'+ie+'处非法'}`});
  let se=0;for(const p of PEOPLE){const a=A[p.name];if(p.sex==='F'){if(a.礼服&&a.礼服.startsWith('M'))se++;if(a.礼帽&&a.礼帽.startsWith('M'))se++;}else{if(a.礼服&&a.礼服.startsWith('F'))se++;if(a.礼帽&&a.礼帽.startsWith('F'))se++;}}
  r.push({ok:se===0,msg:`5 男女装备混用：${se===0?'无混用':'发现'+se+'处混用'}`});
  checkResults=r;return r;
}

// 表4：马靴摆放
function ren4(){
  const bu={};for(const p of PEOPLE){const b=A[p.name]&&A[p.name].马靴;if(!b)continue;if(!bu[b])bu[b]=[];bu[b].push(p.name);}
  function extractCode(cell){
    if(!cell||cell==='置物架')return cell;
    const m=cell.match(/^([A-Z]\d+\/\d+(?:\.\d+)?(?:-\d+)?|[A-Z]\d+(?:-\d+)?)/);
    return m?m[0]:cell;
  }
  // Build name-fill map: each boot cell gets current user names
  const fills={}; // "r,c" -> user string
  for(let r=0;r<BG_TPL.length;r++){
    for(let c=0;c<BG_TPL[r].length;c++){
      const cell=BG_TPL[r][c];
      const code=extractCode(cell);
      if(!code||code==='置物架')continue;
      const users=bu[code]||[];
      if(users.length)fills[r+','+c]=users.join('、');
    }
  }

  const N=BG_TPL.length;
  let h=`<table class="xl-table" style="width:auto"><thead><tr class="title-row"><td colspan="14">马靴摆放</td></tr></thead><tbody>`;
  // Rows with 置物架 merges: row2(A4:C7), row7(A9:B12), row2(L4:N7)
  const mergeMap={};
  // A4:C7 (rows 2-5 = indices 2,3,4,5 all merge into row2 colA)
  for(let r=3;r<=5;r++)mergeMap[r+',0']=true;
  for(let c=1;c<=2;c++)for(let r=2;r<=5;r++)mergeMap[r+','+c]=true;
  // A9:B12 (rows 7-10 = indices 7,8,9,10 merge)
  for(let r=8;r<=10;r++)mergeMap[r+',0']=true;
  for(let c=1;c<=1;c++)for(let r=7;r<=10;r++)mergeMap[r+','+c]=true;
  // L4:N7 (col 11-13 = L-N, rows 2-5)
  for(let c=11;c<=13;c++)for(let r=2;r<=5;r++)mergeMap[r+','+c]=true;

  for(let r=0;r<N;r++){
    h+=`<tr>`;
    for(let c=0;c<14;c++){
      if(mergeMap[r+','+c])continue; // merged away
      const cell=BG_TPL[r][c];
      // Calculate rowspan
      let rs=1,cs=1;
      if(cell==='置物架'){
        if(r===2&&c===0){rs=4;cs=3;} // A4:C7
        else if(r===7&&c===0){rs=4;cs=2;} // A9:B12
        else if(r===2&&c===11){rs=4;cs=3;} // L4:N7
      }
      if(!cell&&cs===1&&rs===1){h+=`<td></td>`;continue;}
      if(cell==='置物架'){
        h+=`<td class="shelf"${rs>1?' rowspan="'+rs+'"':''}${cs>1?' colspan="'+cs+'"':''}>置物架</td>`;
        continue;
      }
      const code=extractCode(cell);
      const users=bu[code]||[];
      const codeOnly=cell===code?'':cell.replace(code,'').replace(/^\s*/,'');
      const isY=BG_YELLOW.has(code),isR=BG_RED.has(code);
      let cls='';
      if(users.length)cls+=' has-user';
      if(isY)cls+=' yellow-bg';
      if(isR)cls+=' red-bg';
      h+=`<td class="${cls}">${code}${codeOnly?'<br>'+codeOnly:''}${users.length?'<br><span class="un">'+users.join('、')+'</span>':''}</td>`;
    }
    h+=`</tr>`;
  }
  h+=`</tbody></table>`;
  document.getElementById('t4').innerHTML=h;
}

  for(let ci=0;ci<6;ci++)ws2['!merges'].push({s:{r:2,c:ci*4},e:{r:2+N2-1,c:ci*4}});
  ws2['!cols']=[{wch:8},{wch:11},{wch:8},{wch:20},{wch:3},{wch:8},{wch:11},{wch:8},{wch:20},{wch:3},{wch:8},{wch:11},{wch:8},{wch:20},{wch:3},{wch:8},{wch:11},{wch:8},{wch:20},{wch:3},{wch:8},{wch:11},{wch:8},{wch:20},{wch:25},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws2,'礼服腰带摆放');

  // Sheet 3
  const N3=HC_TPL.length,s3=[];
  s3.push(Array(12).fill(''));s3[0][0]='礼帽摆放';
  const r3h=[];for(let i=0;i<6;i++)r3h.push('柜号','礼帽');s3.push(r3h);
  for(let row=0;row<N3;row++){const r=[];for(let ci=0;ci<6;ci++)r.push(row===0?cs2[ci]:'',HC_TPL[row][ci]||'');s3.push(r);}
  const ws3=XLSX.utils.aoa_to_sheet(s3);
  ws3['!merges']=[{s:{r:0,c:0},e:{r:0,c:11}}];
  for(let ci=0;ci<6;ci++)ws3['!merges'].push({s:{r:2,c:ci*2},e:{r:2+N3-1,c:ci*2}});
  ws3['!cols']=Array(12).fill({wch:13});ws3['!cols'][0]={wch:8};
  XLSX.utils.book_append_sheet(wb,ws3,'礼帽摆放');

  // Sheet 4
  const bu4={};for(const p of PEOPLE){const b=A[p.name]&&A[p.name].马靴;if(!b)continue;if(!bu4[b])bu4[b]=[];bu4[b].push(p.name);}
  const s4=[];s4.push(Array(14).fill(''));s4[0][0]='马靴摆放';
  for(const row of BG_TPL){
    const r=[];
    for(const item of row){
      if(!item){r.push('');continue;}
      if(item==='置物架'){r.push('置物架');continue;}
      const code=(item.match(/^([A-Z]\d+\/\d+(?:\.\d+)?(?:-\d+)?|[A-Z]\d+(?:-\d+)?)/)||[])[0]||item;
      const users=bu4[code]||[];r.push(users.length?`${item} ${users.join('、')}`:item);
    }
    s4.push(r);
  }
  const ws4=XLSX.utils.aoa_to_sheet(s4);
  ws4['!merges']=[{s:{r:0,c:0},e:{r:0,c:13}},{s:{r:3,c:0},e:{r:6,c:2}},{s:{r:8,c:0},e:{r:11,c:1}},{s:{r:3,c:11},e:{r:6,c:13}}];
  ws4['!cols']=[{wch:20},{wch:10},{wch:18},{wch:18},{wch:18},{wch:23},{wch:20},{wch:20},{wch:21},{wch:22},{wch:22},{wch:18},{wch:20},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws4,'马靴摆放');

  const wbout=XLSX.write(wb,{bookType:'xlsx',type:'array',bookSST:false});
  const blob=new Blob([wbout],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='礼服分配表.xlsx';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}

// ==================== UI ====================
function runAll(){
  S=parseSched(document.getElementById('schedInput').value);
  initA();autoAllocate();
  const r=selfCheck(),el=document.getElementById('checkPanel');el.style.display='block';
  let h=`<div class="check-title">强制自检（5项校验）</div>`;
  for(const item of r)h+=`<div class="${item.ok?'pass':'fail'}">${item.msg}</div>`;
  const allOk=r.every(x=>x.ok);
  h+=`<div style="margin-top:6px;font-size:14px;font-weight:bold;color:${allOk?'#27ae60':'#e74c3c'}">${allOk?'全部通过 | 表2/3/4完全复刻春四周模板':'存在未通过，请检查'}</div>`;
  el.innerHTML=h;renAll();
}
function switchTab(i){
  for(let j=0;j<4;j++)document.getElementById('sec'+j).style.display=j===i?'block':'none';
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
}
initA();computeNotes();renAll();
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();runAll();}
  for(let i=0;i<4;i++)if(e.ctrlKey&&e.key===String(i+1)){e.preventDefault();switchTab(i);}
});
</script>
