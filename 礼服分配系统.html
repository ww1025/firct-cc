// ======================== STATE ========================
let A={},S={},checkResults=[];

function initA(){
  A={};
  for(const p of PEOPLE){
    const b=BASE[p.name]||{},beltMap=p.sex==='F'?BELT_F:BELT_M;
    const d=b.礼服||'';A[p.name]={礼服:d,礼帽:b.礼帽||'',马靴:b.马靴||'',腰带:beltMap[d]||'',备注:'',changed:{}};
  }
  computeNotes();
}

function computeNotes(){
  for(const p of PEOPLE)A[p.name].备注='';
  function group(f){const m={};for(const p of PEOPLE){const v=A[p.name][f];if(!v)continue;if(!m[v])m[v]=[];m[v].push(p.name);}return m;}
  function add(n,t){if(!t)return;A[n].备注=A[n].备注?A[n].备注+'、'+t:t;}
  for(const[f,lb]of[['礼服','礼服'],['礼帽','礼帽'],['马靴','马靴']]){
    const g=group(f);
    for(const[eq,names]of Object.entries(g)){
      if(names.length>1)for(const n of names)add(n,`和${names.filter(x=>x!==n).join('、')}共用${lb}`);
    }
  }
}

function parseSched(text){
  const days=['周一','周二','周三','周四','周五'],r={};for(const d of days)r[d]=[];
  if(!text.trim())return r;
  for(const line of text.split('\n')){
    for(const d of days){
      if(line.includes(d)||line.includes(d.replace('周','星期'))){
        const p=line.split(/[：:]/);if(p.length>=2)r[d]=p[1].split(/[、，,\s]+/).map(s=>s.trim()).filter(Boolean);
      }
    }
  }
  return r;
}

function autoAllocate(){
  const usage={礼服:{},礼帽:{},马靴:{},腰带:{}};
  function ok(eq,f,dd){if(!eq)return true;const u=usage[f][eq]||[];if(u.length>=2)return false;for(const o of u)for(const d of dd)if((S[d]||[]).includes(o))return false;return true;}
  function pick(pool,f,dd){for(const eq of pool)if(ok(eq,f,dd))return eq;for(const eq of pool)if((usage[f][eq]||[]).length<2)return eq;return pool[0];}
  function dutyDays(n){const ds=[];for(const[d,ns]of Object.entries(S))if(ns.includes(n))ds.push(d);return ds;}
  const sorted=[...PEOPLE].sort((a,b)=>{const ad=dutyDays(a.name)?0:1,bd=dutyDays(b.name)?0:1;if(ad!==bd)return ad-bd;return a.cls-b.cls;});
  for(const p of sorted){
    const dd=dutyDays(p.name),isF=p.sex==='F',beltMap=isF?BELT_F:BELT_M;
    const dp=isF?DRESS_F:DRESS_M;let d=A[p.name].礼服;if(!d||!dp.includes(d)||!ok(d,'礼服',dd))d=pick(dp,'礼服',dd);
    const hp=isF?HAT_F:HAT_M;let h=A[p.name].礼帽;if(!h||!hp.includes(h)||!ok(h,'礼帽',dd))h=pick(hp,'礼帽',dd);
    let b=A[p.name].马靴;if(!b||!BOOTS.includes(b)||!ok(b,'马靴',dd))b=pick(BOOTS,'马靴',dd);
    const ch={},base=BASE[p.name]||{};if(d!==base.礼服&&base.礼服)ch.礼服=true;if(h!==base.礼帽&&base.礼帽)ch.礼帽=true;if(b!==base.马靴&&base.马靴)ch.马靴=true;
    A[p.name]={礼服:d,礼帽:h,马靴:b,腰带:beltMap[d]||'',备注:A[p.name].备注,changed:ch};
    for(const[f,v]of[['礼服',d],['礼帽',h],['马靴',b],['腰带',beltMap[d]||'']]){if(!v)continue;if(!usage[f][v])usage[f][v]=[];if(!usage[f][v].includes(p.name))usage[f][v].push(p.name);}
  }
  computeNotes();
}

function selfCheck(){
  const r=[],days=['周一','周二','周三','周四','周五'];let cc=0;
  for(const day of days){const names=S[day]||[];if(!names.length)continue;for(const f of['礼服','礼帽','马靴','腰带']){const em={};for(const n of names){const v=A[n]&&A[n][f];if(!v)continue;if(!em[v])em[v]=[];em[v].push(n);}for(const[eq,ns]of Object.entries(em))if(ns.length>1){cc++;r.push({ok:false,msg:`${day} ${ns.join('、')}共用${f}「${eq}」`});}}}
  r.push({ok:cc===0,msg:`① 每日装备冲突：${cc===0?'✅ 无冲突':'❌ '+cc+'处冲突'}`});
  let be=0;for(const p of PEOPLE){const a=A[p.name];if(!a.礼服)continue;const bm=p.sex==='F'?BELT_F:BELT_M,ex=bm[a.礼服];if(ex&&a.腰带!==ex){be++;r.push({ok:false,msg:`${p.name} 礼服${a.礼服}→腰带${a.腰带}≠${ex}`});}}
  r.push({ok:be===0,msg:`② 礼服腰带绑定：${be===0?'✅ 全部正确':'❌ '+be+'处错配'}`});
  let ne=0;function en(note){const ns=[];const re=/和([^共]+)共用/g;let m;while((m=re.exec(note))!==null)for(const s of m[1].split('、')){const t=s.trim();if(t)ns.push(t);}return ns;}
  for(const p of PEOPLE){const note=A[p.name].备注||'';for(const o of en(note)){if(!(A[o]||{}).备注||!(A[o].备注.includes(p.name))){ne++;r.push({ok:false,msg:`${p.name}→${o} 备注未双向`});}}}
  r.push({ok:ne===0,msg:`③ 共用关系双向：${ne===0?'✅ 完整':'❌ '+ne+'处遗漏'}`});
  let ie=0;for(const p of PEOPLE){const a=A[p.name],isF=p.sex==='F';if(a.礼服&&!(isF?DRESS_F:DRESS_M).includes(a.礼服)){ie++;r.push({ok:false,msg:`${p.name}礼服${a.礼服}无效`});}if(a.礼帽&&!(isF?HAT_F:HAT_M).includes(a.礼帽)){ie++;r.push({ok:false,msg:`${p.name}礼帽${a.礼帽}无效`});}if(a.马靴&&!BOOTS.includes(a.马靴)){ie++;r.push({ok:false,msg:`${p.name}马靴${a.马靴}无效`});}}
  r.push({ok:ie===0,msg:`④ 装备编号合法：${ie===0?'✅ 全部有效':'❌ '+ie+'处非法'}`});
  let se=0;for(const p of PEOPLE){const a=A[p.name];if(p.sex==='F'){if(a.礼服&&a.礼服.startsWith('M')){se++;r.push({ok:false,msg:`${p.name}(女)用男款礼服`});}if(a.礼帽&&a.礼帽.startsWith('M')){se++;r.push({ok:false,msg:`${p.name}(女)用男款礼帽`});}}else{if(a.礼服&&a.礼服.startsWith('F')){se++;r.push({ok:false,msg:`${p.name}(男)用女款礼服`});}if(a.礼帽&&a.礼帽.startsWith('F')){se++;r.push({ok:false,msg:`${p.name}(男)用女款礼帽`});}}}
  r.push({ok:se===0,msg:`⑤ 男女装备混用：${se===0?'✅ 无混用':'❌ '+se+'处混用'}`});
  checkResults=r;return r;
}

function ren4(){

  let h=`<table class="xlt t4-table"><thead><tr class="title-row"><td colspan="14">马靴摆放</td></tr></thead><tbody>`;
  for(const row of BOOT_GRID){
    h+=`<tr>`;
    for(const item of row){
      if(!item){h+=`<td></td>`;continue;}
      if(item==='置物架'){h+=`<td class="shelf">置物架</td>`;continue;}
      const m=item.match(/^([A-Z]\d+\/\d+(?:\.\d+)?(?:-\d+)?|[A-Z]\d+(?:-\d+)?)/);
      if(!m){h+=`<td class="empty-boot">${item}</td>`;continue;}
      const code=m[0],users=bu[code]||[];
      h+=`<td class="${users.length?'has-user':'empty-boot'}">${code}${users.length?'<br><span class="un">'+users.join('、')+'</span>':''}</td>`;
    }
    h+=`</tr>`;
  }
  // Show unplaced boots
  const placed=new Set(BOOT_GRID.flat().map(x=>{const m=(x||'').match(/^([A-Z]\d+\/\d+(?:\.\d+)?(?:-\d+)?|[A-Z]\d+(?:-\d+)?)/);return m?m[0]:null;}).filter(Boolean));
  const unplaced=BOOTS.filter(b=>!placed.has(b)&&(bu[b]||[]).length>0);
  if(unplaced.length){
    h+=`<tr><td colspan="14" style="color:#f39c12;font-size:11px;padding:6px">⚠ 以下已分配的马靴编号不在模板网格中：${unplaced.map(b=>b+(bu[b]||[]).join('、')).join('，')}</td></tr>`;
  }
  h+=`</tbody></table>`;
  document.getElementById('t4').innerHTML=h;
}

function exportXLSX(){
  if(typeof XLSX==='undefined'){alert('SheetJS 加载中，请稍后再试');return;}
  const wb=XLSX.utils.book_new();

  // ---- Sheet 1: 装备分配 (cols A-G + note in H) ----
  const s1=[['班级','姓名','礼服','礼帽','马靴','腰带','备注','备注：黄色为较先前有变化','','','']];

  // Rows 3+: Data (柜号 only in first row of each cab, for merge)
  const maxR2=Math.max(...CAB_DRESS.map(c=>c.length),1),cabs=['一','二','三','四','五','六'];
  for(let row=0;row<maxR2;row++){

      const c=ci*4;

    }

  const ws2=XLSX.utils.aoa_to_sheet(s2);

  for(let ci=0;ci<6;ci++){
    const sc=ci*4,ec=sc;
    ws2['!merges'].push({s:{r:2,c:sc},e:{r:2+maxR2-1,c:ec}});
  }
  ws2['!cols']=Array(26).fill(null).map((_,i)=>{
    const p=i%4;if(p===0)return{wch:8};if(p===1)return{wch:11};if(p===2)return{wch:8};return{wch:20};
  });
  XLSX.utils.book_append_sheet(wb,ws2,'礼服腰带摆放');

  // ---- Sheet 3: 礼帽摆放 (12 cols: 6 cabs×2) ----
  const s3=[],maxR3=Math.max(...CAB_HAT.map(c=>c.length),1);
  s3.push(Array(12).fill(''));s3[0][0]='礼帽摆放';

  for(let row=0;row<maxR3;row++){
    const r=[];for(let ci=0;ci<6;ci++){r.push(row===0?cabs[ci]:'',CAB_HAT[ci][row]||'');}s3.push(r);
  }
  const ws3=XLSX.utils.aoa_to_sheet(s3);
  ws3['!merges']=[{s:{r:0,c:0},e:{r:0,c:11}}];
  for(let ci=0;ci<6;ci++){const sc=ci*2;ws3['!merges'].push({s:{r:2,c:sc},e:{r:2+maxR3-1,c:sc}});}
  ws3['!cols']=Array(12).fill({wch:11});
  XLSX.utils.book_append_sheet(wb,ws3,'礼帽摆放');

  // ---- Sheet 4: 马靴摆放 (14 cols, merged regions from reference) ----
  const bu4={};for(const p of PEOPLE){const b=A[p.name]&&A[p.name].马靴;if(!b)continue;if(!bu4[b])bu4[b]=[];bu4[b].push(p.name);}
  const s4=[];s4.push(Array(14).fill(''));s4[0][0]='马靴摆放';
  for(const row of BOOT_GRID){
    const r=[];
    for(const item of row){
      if(!item){r.push('');continue;}
      if(item==='置物架'){r.push('置物架');continue;}
      const m=item.match(/^([A-Z]\d+\/\d+(?:\.\d+)?(?:-\d+)?|[A-Z]\d+(?:-\d+)?)/);
      if(!m){r.push(item);continue;}
      const code=m[0],users=bu4[code]||[];r.push(users.length?`${code} ${users.join('、')}`:code);
    }
    s4.push(r);
  }
  const ws4=XLSX.utils.aoa_to_sheet(s4);

  ws4['!cols']=[{wch:20},{wch:10},{wch:18},{wch:18},{wch:18},{wch:23},{wch:20},{wch:20},{wch:21},{wch:22},{wch:22},{wch:18},{wch:20},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws4,'马靴摆放');

  XLSX.writeFile(wb,'礼服分配表.xlsx');
}

}

  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();runAll();}
  for(let i=0;i<4;i++)if(e.ctrlKey&&e.key===String(i+1)){e.preventDefault();switchTab(i);}
});
</script>
