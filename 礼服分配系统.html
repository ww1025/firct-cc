function computeNotes() {
  for (const p of PEOPLE) A[p.name].备注 = '';
  function group(field) {
    const m = {};
    for (const p of PEOPLE) { const v = A[p.name][field]; if (!v) continue; if (!m[v]) m[v] = []; m[v].push(p.name); }

  }
  function add(name, note) {
    if (!note) return;
    A[name].备注 = A[name].备注 ? A[name].备注 + '、' + note : note;
  }
  for (const [field, label] of [['礼服','礼服'],['礼帽','礼帽'],['马靴','马靴']]) {
    const g = group(field);
    for (const [eq, names] of Object.entries(g)) {

        for (const n of names) {
          add(n, `和${names.filter(x=>x!==n).join('、')}共用${label}`);
        }
      }
    }
  }

// ====================== 排班解析 ======================
function parseSched(text) {
  const days = ['周一','周二','周三','周四','周五'];
  const r = {}; for (const d of days) r[d] = [];
  if (!text.trim()) return r;
  for (const line of text.split('\n')) {
    for (const d of days) {
      if (line.includes(d) || line.includes(d.replace('周','星期'))) {
        const parts = line.split(/[：:]/);
        if (parts.length >= 2) {
          r[d] = parts[1].split(/[、，,\s]+/).map(s=>s.trim()).filter(Boolean);
        }
      }
    }
  }
  return r;
}

// ====================== 自动分配引擎 ======================

  const usage = {礼服:{},礼帽:{},马靴:{},腰带:{}}; // eq -> [names]

  function ok(eq, field, dutyDays) {
    if (!eq) return true;
    const u = usage[field][eq] || [];
    if (u.length >= 2) return false;
    for (const other of u) {
      for (const d of dutyDays) {
        if ((S[d]||[]).includes(other)) return false;
      }
    }
    return true;
  }

  function pick(pool, field, dutyDays) {
    // First try: items with no conflicts
    for (const eq of pool) { if (ok(eq, field, dutyDays)) return eq; }
    // Fallback: any item with <2 users
    for (const eq of pool) { if ((usage[field][eq]||[]).length < 2) return eq; }
    return pool[0]; // force
  }

  function dutyDays(name) {
    const ds = [];
    for (const [d, names] of Object.entries(S)) { if (names.includes(name)) ds.push(d); }
    return ds;
  }

  // Sort: people on duty first, then by class
  const sorted = [...PEOPLE].sort((a,b) => {
    const ad = dutyDays(a.name).length ? 0 : 1;
    const bd = dutyDays(b.name).length ? 0 : 1;
    if (ad !== bd) return ad - bd;
    return a.cls - b.cls;
  });

  for (const p of sorted) {
    const dd = dutyDays(p.name);
    const isF = p.sex === 'F';
    const beltMap = isF ? BELT_F : BELT_M;

    // 礼服
    const dp = isF ? DRESS_F : DRESS_M;
    let d = A[p.name].礼服;
    if (!d || !dp.includes(d) || !ok(d, '礼服', dd)) d = pick(dp, '礼服', dd);

    // 礼帽
    const hp = isF ? HAT_F : HAT_M;
    let h = A[p.name].礼帽;
    if (!h || !hp.includes(h) || !ok(h, '礼帽', dd)) h = pick(hp, '礼帽', dd);

    // 马靴
    let b = A[p.name].马靴;
    if (!b || !BOOTS.includes(b) || !ok(b, '马靴', dd)) b = pick(BOOTS, '马靴', dd);

    // Track changes
    const base = BASE[p.name] || {};
    const ch = {};
    if (d !== base.礼服 && base.礼服) ch.礼服 = true;
    if (h !== base.礼帽 && base.礼帽) ch.礼帽 = true;
    if (b !== base.马靴 && base.马靴) ch.马靴 = true;

    A[p.name] = {礼服:d, 礼帽:h, 马靴:b, 腰带:beltMap[d]||'', 备注:A[p.name].备注, changed:ch};

    for (const [f,v] of [['礼服',d],['礼帽',h],['马靴',b],['腰带',beltMap[d]||'']]) {
      if (!v) continue;
      if (!usage[f][v]) usage[f][v] = [];
      if (!usage[f][v].includes(p.name)) usage[f][v].push(p.name);
    }
  }
  computeNotes();
}

// ====================== 自检 ======================
function selfCheck() {
  const results = [];
  const days = ['周一','周二','周三','周四','周五'];

  // 1. 每日排班无装备冲突
  let conflictCount = 0;
  for (const day of days) {
    const names = S[day] || [];
    if (!names.length) continue;
    for (const f of ['礼服','礼帽','马靴','腰带']) {
      const eqMap = {};
      for (const n of names) {
        const v = A[n] && A[n][f];
        if (!v) continue;
        if (!eqMap[v]) eqMap[v] = [];
        eqMap[v].push(n);
      }
      for (const [eq, ns] of Object.entries(eqMap)) {
        if (ns.length > 1) {
          conflictCount++;
          results.push({ok:false, msg:`${day} ${ns.join('、')} 共用${f}「${eq}」冲突`});
        }
      }
    }
  }
  results.push({ok:conflictCount===0, msg:`每日装备冲突检查：${conflictCount===0?'✅ 全部通过':'❌ 发现'+conflictCount+'处冲突'}`});

  // 2. 礼服腰带绑定检查
  let beltErrors = 0;
  for (const p of PEOPLE) {
    const a = A[p.name];
    if (!a.礼服) continue;
    const beltMap = p.sex==='F' ? BELT_F : BELT_M;
    const expected = beltMap[a.礼服];
    if (expected && a.腰带 !== expected) {
      beltErrors++;
      results.push({ok:false, msg:`${p.name} 礼服${a.礼服}→腰带应为${expected}，实际${a.腰带}`});
    }
  }
  results.push({ok:beltErrors===0, msg:`礼服腰带绑定检查：${beltErrors===0?'✅ 全部正确':'❌ '+beltErrors+'处错配'}`});

  // 3. 共用关系双向标注
  let noteErrors = 0;
  function extractNames(note) {
    const names = [];
    const re = /和([^共]+)共用/g;
    let m;
    while ((m = re.exec(note)) !== null) {
      for (const s of m[1].split('、')) { const t = s.trim(); if (t) names.push(t); }
    }
    return names;
  }
  for (const p of PEOPLE) {
    const note = A[p.name].备注 || '';
    const mentioned = extractNames(note);
    for (const other of mentioned) {
      const otherNote = (A[other]||{}).备注 || '';
      if (!otherNote.includes(p.name)) {
        noteErrors++;
        results.push({ok:false, msg:`${p.name}备注提到${other}，但${other}备注未回指${p.name}`});
      }
    }
  }
  results.push({ok:noteErrors===0, msg:`共用关系双向标注：${noteErrors===0?'✅ 全部完整':'❌ '+noteErrors+'处遗漏'}`});

  // 4. 装备编号合法性
  let invErrors = 0;
  for (const p of PEOPLE) {
    const a = A[p.name];
    const isF = p.sex === 'F';
    if (a.礼服 && !(isF?DRESS_F:DRESS_M).includes(a.礼服)) { invErrors++; results.push({ok:false, msg:`${p.name} 礼服${a.礼服}不在库存中`}); }
    if (a.礼帽 && !(isF?HAT_F:HAT_M).includes(a.礼帽)) { invErrors++; results.push({ok:false, msg:`${p.name} 礼帽${a.礼帽}不在库存中`}); }
    if (a.马靴 && !BOOTS.includes(a.马靴)) { invErrors++; results.push({ok:false, msg:`${p.name} 马靴${a.马靴}不在库存中`}); }
    if (a.腰带 && !Object.values(isF?BELT_F:BELT_M).includes(a.腰带)) { invErrors++; results.push({ok:false, msg:`${p.name} 腰带${a.腰带}不在库存中`}); }
  }
  results.push({ok:invErrors===0, msg:`装备编号合法性：${invErrors===0?'✅ 全部有效':'❌ '+invErrors+'处非法'}`});

  // 5. 男女装备不混用
  let sexErrors = 0;
  for (const p of PEOPLE) {
    const a = A[p.name];
    if (p.sex === 'F') {
      if (a.礼服 && a.礼服.startsWith('M')) { sexErrors++; results.push({ok:false, msg:`${p.name}(女)使用了男款礼服${a.礼服}`}); }
      if (a.礼帽 && a.礼帽.startsWith('M')) { sexErrors++; results.push({ok:false, msg:`${p.name}(女)使用了男款礼帽${a.礼帽}`}); }
    } else {
      if (a.礼服 && a.礼服.startsWith('F')) { sexErrors++; results.push({ok:false, msg:`${p.name}(男)使用了女款礼服${a.礼服}`}); }
      if (a.礼帽 && a.礼帽.startsWith('F')) { sexErrors++; results.push({ok:false, msg:`${p.name}(男)使用了女款礼帽${a.礼帽}`}); }
    }
  }
  results.push({ok:sexErrors===0, msg:`男女装备混用检查：${sexErrors===0?'✅ 无混用':'❌ '+sexErrors+'处混用'}`});

  checkResults = results;
  return results;
}

// ====================== 渲染 ======================
function renderAll() {
  renderT1(); renderT2(); renderT3(); renderT4();
  attachEditors();
}

// 表1：装备分配

  const dutySet = new Set();
  for (const d of Object.values(S)) for (const n of d) dutySet.add(n);

  let prevCls = 0, h = '';
  h += '<table class="xl-table"><thead><tr><th>班级</th><th>姓名</th><th>礼服</th><th>礼帽</th><th>马靴</th><th>腰带</th><th>备注</th></tr></thead><tbody>';
  for (const p of PEOPLE) {
    if (p.cls !== prevCls) {
      if (prevCls) h += '<tr class="class-gap"><td colspan="7"></td></tr>';
      prevCls = p.cls;
    }
    const a = A[p.name] || {};
    const onDuty = dutySet.has(p.name);
    h += '<tr>';
    h += `<td>${p.cls}班</td>`;
    h += `<td>${p.name}${onDuty?'<span class="duty-mark">👤</span>':''}</td>`;
    h += `<td contenteditable data-n="${p.name}" data-f="礼服" class="${a.changed.礼服?'changed':''}">${a.礼服||''}${a.changed.礼服?'<span class="changed-marker">(变动)</span>':''}</td>`;
    h += `<td contenteditable data-n="${p.name}" data-f="礼帽" class="${a.changed.礼帽?'changed':''}">${a.礼帽||''}${a.changed.礼帽?'<span class="changed-marker">(变动)</span>':''}</td>`;
    h += `<td contenteditable data-n="${p.name}" data-f="马靴" class="${a.changed.马靴?'changed':''}">${a.马靴||''}${a.changed.马靴?'<span class="changed-marker">(变动)</span>':''}</td>`;
    h += `<td>${a.腰带||''}</td>`;
    h += `<td contenteditable data-n="${p.name}" data-f="备注" style="font-size:11px;max-width:260px;white-space:normal">${a.备注||''}</td>`;
    h += '</tr>';
  }
  h += '<tr class="footer-note"><td colspan="7">备注：<span style="background:#ffe066;color:#000;padding:0 4px">黄色</span>为较先前有变化（标注"(变动)"）&nbsp;|&nbsp; 👤 本周有执勤 &nbsp;|&nbsp; 礼服/礼帽/马靴/备注列可直接点击编辑</td></tr>';
  h += '</tbody></table>';
  document.getElementById('t1').innerHTML = h;
}

// 表2：礼服腰带摆放
function renderT2() {
  // Gather usage
  const uF = {}, uM = {};
  for (const p of PEOPLE) {
    const a = A[p.name]; if (!a.礼服) continue;
    (p.sex==='F'?uF:uM)[a.礼服] = [...((p.sex==='F'?uF:uM)[a.礼服]||[]), p.name];
  }
  // Cabinet layout matching historical Excel
  // Female cabinets (一~三), Male (四~六)
  // Distribute sorted by size, interleaved across 3 cabinets
  const fSorted = [...DRESS_F].sort();
  const mSorted = [...DRESS_M].sort();
  const fc = [[],[],[]]; // cabinets 一~三
  const mc = [[],[],[]]; // cabinets 四~六
  for (let i=0;i<fSorted.length;i++) fc[i%3].push(fSorted[i]);
  for (let i=0;i<mSorted.length;i++) mc[i%3].push(mSorted[i]);
  for (const c of [...fc,...mc]) c.sort();

  const allCabs = [...fc, ...mc];
  const cabNames = ['一','二','三','四','五','六'];
  const maxR = Math.max(...allCabs.map(c=>c.length), 1);

  let h = '<table class="xl-table"><thead>';
  // Row 1: cabinet titles
  h += '<tr>';
  for (let i=0;i<6;i++) h += `<th colspan="3" class="cab-title">柜${cabNames[i]}</th>`;
  h += '</tr>';
  // Row 2: sub-headers
  h += '<tr>';
  for (let i=0;i<6;i++) h += '<th>礼服</th><th>腰带</th><th>使用人</th>';
  h += '</tr></thead><tbody>';

  for (let row=0;row<maxR;row++) {
    h += '<tr>';
    for (let ci=0;ci<6;ci++) {
      const eq = allCabs[ci][row] || '';
      const isF = eq.startsWith('F');
      const beltMap = isF ? BELT_F : BELT_M;
      const belt = beltMap[eq] || '';
      const users = (isF?uF:uM)[eq] || [];
      h += `<td class="${!eq?'empty-slot':''}">${eq||''}</td>`;
      h += `<td class="${!eq?'empty-slot':''}">${belt}</td>`;
      h += `<td>${users.length?`<span class="user-name">${users.join('、')}</span>`:''}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  document.getElementById('t2').innerHTML = h;
}

// 表3：礼帽摆放
function renderT3() {
  const fh = [...HAT_F].sort();
  const mh = [...HAT_M].sort();
  function dist3(arr) { const c=[[],[],[]]; for(let i=0;i<arr.length;i++)c[i%3].push(arr[i]); return c; }
  const all = [...dist3(fh), ...dist3(mh)];
  const maxR = Math.max(...all.map(c=>c.length),1);
  const cabNames = ['一','二','三','四','五','六'];

  let h = '<table class="xl-table"><thead><tr>';
  for (let i=0;i<6;i++) h += `<th class="cab-title">柜${cabNames[i]}</th>`;
  h += '</tr></thead><tbody>';
  for (let row=0;row<maxR;row++) {
    h += '<tr>';
    for (let ci=0;ci<6;ci++) {
      const hat = all[ci][row] || '';
      h += `<td class="${!hat?'empty-slot':''}">${hat}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  document.getElementById('t3').innerHTML = h;
}

// 表4：马靴摆放
function renderT4() {
  const bu = {}; // boot -> [names]
  for (const p of PEOPLE) {
    const b = A[p.name]&&A[p.name].马靴;
    if (!b) continue;
    if (!bu[b]) bu[b] = [];
    bu[b].push(p.name);
  }
  function cell(b) {
    const users = bu[b] || [];
    return users.length ? `${b} ${users.join('、')}` : b;
  }

  // Grid layout matching historical Excel pattern
  const grid = [
    ['X44','X44','X43','X44','X39','N43/41','N43/41','N43/43','N43/43','N43/43','N43/46','N44/44.5','X42','X42'],
    ['X43','X43','X43','X43','X39','N42/42.5','N42/42.5','N42/42.5','N42/43.5','N42/44','N42/44.5','N45/45','X42','X42'],
    ['置物架','','','X43','X38','N42/40.5','N42/40.5','N42/40.5','N42/43','N42/43','N42/43.5','置物架','',''],
    ['','','','X43','X38','N41/42','N41/42','N41/42','N42/42','N42/42','N42/42.5','','',''],
    ['','','','X43','X38','X38_2','N39/40.5','N40/39.5','N40/39.5','N41/42','N41/43.5','N42/40.5','',''],
    ['','','','X42','J38','N38/40','N38/40','N38/40','N40/41','N40/41','N40/41','','',''],
    ['','','','','','','','','N38/41','N39/38','N39/38','X42','X42','X42'],
    ['置物架','','','','X37','N37/40','N37/41','N38/37','N38/37.5','N38/37.5','N38/37.5','X42','X42','X42'],
    ['','','','J41','X37','N37/37','N37/37.5','N37/37.5','N37/38','N37/38','N37/39.5','X42','X42','X42'],
    ['','','X45','J41','X36','N36/38','N36/39','N37/36.5','N37/37','N37/37','N37/37','X41','X41','X41'],
    ['','','X39','X39','J36','N35/36','N35/37','N36/36','N36/36','N36/37','N36/38','X39','X39','X39'],
  ];

  // Map grid items to actual boots
  function mapBoot(code) {
    if (!code || code === '置物架' || code.startsWith('X38_')) return code;
    // Find matching boots from inventory
    const base = code.replace(/_\d+$/,'');
    const variants = BOOTS.filter(b => b === base || b.startsWith(base+'/') || base.startsWith(b.replace(/\/.*/,'')));
    // Return the base code for display
    return base;
  }

  let h = '<table class="xl-table"><tbody>';
  h += '<tr><td colspan="14" style="background:rgba(139,0,0,.4);color:#f39c12;font-weight:bold;text-align:center;font-size:14px;padding:8px">马靴摆放 · 网格布局（大码/特殊款靠上层、置物架集中放置）</td></tr>';

  for (const row of grid) {
    h += '<tr>';
    for (const item of row) {
      if (!item) { h += '<td></td>'; continue; }
      if (item === '置物架') { h += '<td style="background:rgba(100,100,100,.3);color:#aaa;font-weight:bold;font-size:12px">置物架</td>'; continue; }

      const users = bu[item] || [];
      h += `<td style="font-size:12px;${users.length?'':'color:#666'}">${item}${users.length?'<br><span class="user-name">'+users.join('、')+'</span>':''}</td>`;
    }
    h += '</tr>';
  }

  // Unplaced boots
  const placed = new Set(grid.flat().filter(Boolean).filter(x=>x!=='置物架'));
  const remaining = BOOTS.filter(b => !placed.has(b));
  if (remaining.length) {
    h += '<tr><td colspan="14" style="color:#888;font-size:11px;padding:4px">未在网格中的库存：';
    h += remaining.map(b => {
      const users = bu[b]||[];
      return users.length ? `<span class="user-name">${b}(${users.join('、')})</span>` : b;
    }).join('、');
    h += '</td></tr>';
  }
  h += '</tbody></table>';
  document.getElementById('t4').innerHTML = h;
}

// ====================== 编辑支持 ======================
function attachEditors() {
  document.querySelectorAll('td[contenteditable]').forEach(cell => {
    cell.removeEventListener('blur', onEdit);
    cell.addEventListener('blur', onEdit);
  });
}

function onEdit(e) {
  const name = e.target.dataset.n;
  const field = e.target.dataset.f;
  const val = e.target.textContent.replace(/\(变动\)/g,'').trim();
  if (!A[name]) return;
  A[name][field] = val;
  if (field === '礼服') {
    const p = PEOPLE.find(x=>x.name===name);
    const beltMap = p&&p.sex==='F' ? BELT_F : BELT_M;
    A[name].腰带 = beltMap[val] || '';
  }
  computeNotes();
  renderAll();
  doCheck();
}

// ====================== 主流程 ======================
function runAll() {
  S = parseSched(document.getElementById('scheduleInput').value);
  initA();
  autoAllocate();
  doCheck();
  renderAll();
}

function doCheck() {
  const r = selfCheck();
  const el = document.getElementById('checkPanel');
  el.style.display = 'block';
  let html = '<div class="check-title">🔍 强制自检结果（5项校验）</div>';
  for (const item of r) {
    html += `<div class="${item.ok?'pass':'fail'}">${item.msg}</div>`;
  }
  const allOk = r.every(x=>x.ok);
  html += `<div style="margin-top:8px;font-size:15px;font-weight:bold;color:${allOk?'#27ae60':'#e74c3c'}">${allOk?'✅ 全部校验通过，可放心使用':'⚠️ 存在校验未通过项，请检查上方详情'}</div>`;
  el.innerHTML = html;
}

// ====================== UI辅助 ======================
function switchTab(i) {
  for (let j=0;j<4;j++) document.getElementById('sec'+j).style.display = j===i ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
}

function exportAll() {
  let csv = '﻿班级,姓名,礼服,礼帽,马靴,腰带,备注\n';
  for (const p of PEOPLE) {
    const a = A[p.name]||{};
    csv += `${p.cls}班,${p.name},${a.礼服||''},${a.礼帽||''},${a.马靴||''},${a.腰带||''},"${(a.备注||'').replace(/"/g,'""')}"\n`;
  }
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='礼服分配表.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ====================== 启动 ======================
initA(); computeNotes(); renderAll();

document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key==='Enter') runAll();
  for (let i=0;i<4;i++) if (e.ctrlKey && e.key===String(i+1)) switchTab(i);
});
