<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --tomato: #f08080;
    --tomato-light: #f5a5a5;
    --green: #2ecc71;
    --blue: #3498db;
    --text: #eee;
    --text-dim: #999;
    --ring-bg: #2a2a4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(240,128,128,0.06) 0%, transparent 50%),
                radial-gradient(circle at 30% 70%, rgba(52,152,219,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .mode-tabs {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border-radius: 40px;
    padding: 5px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .mode-tab {
    padding: 10px 24px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    border-radius: 35px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }

  .mode-tab:hover { color: var(--text); }

  .mode-tab.active {
    background: var(--tomato);
    color: #fff;
    box-shadow: 0 4px 15px rgba(240,128,128,0.4);
  }

  .mode-tab.break-active {
    background: var(--green);
    box-shadow: 0 4px 15px rgba(46,204,113,0.4);
    color: #fff;
  }

  .mode-tab.long-break-active {
    background: var(--blue);
    box-shadow: 0 4px 15px rgba(52,152,219,0.4);
    color: #fff;
  }

  .timer-wrapper {
    position: relative;
    width: 340px;
    height: 340px;
  }

  .timer-ring { transform: rotate(-90deg); }

  .ring-bg {
    fill: none;
    stroke: var(--ring-bg);
    stroke-width: 8;
  }

  .ring-progress {
    fill: none;
    stroke: var(--tomato);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear, stroke 0.5s ease;
  }

  .ring-progress.break-mode { stroke: var(--green); }
  .ring-progress.long-break-mode { stroke: var(--blue); }

  .time-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .time-text {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'PingFang SC', monospace;
    line-height: 1;
    text-shadow: 0 0 40px rgba(240,128,128,0.3);
  }

  .time-label {
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .btn {
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-main {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--tomato);
    color: #fff;
    font-size: 32px;
    box-shadow: 0 8px 30px rgba(240,128,128,0.45);
  }

  .btn-main:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 40px rgba(240,128,128,0.6);
  }

  .btn-main:active { transform: scale(0.95); }

  .btn-main.paused {
    background: var(--green);
    box-shadow: 0 8px 30px rgba(46,204,113,0.45);
  }

  .btn-main.paused:hover {
    box-shadow: 0 12px 40px rgba(46,204,113,0.6);
  }

  .btn-secondary {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    font-size: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .btn-secondary:hover {
    background: #2a2a5a;
    transform: scale(1.08);
  }

  .btn-secondary:active { transform: scale(0.92); }

  .session-dots {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .session-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--ring-bg);
    transition: all 0.4s ease;
  }

  .session-dot.done {
    background: var(--tomato);
    box-shadow: 0 0 12px rgba(240,128,128,0.5);
  }

  .session-label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-left: 4px;
  }

  .settings-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--surface);
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .settings-toggle:hover {
    color: var(--text);
    transform: rotate(90deg);
  }

  .settings-panel {
    position: fixed;
    top: 0;
    right: -380px;
    width: 360px;
    height: 100vh;
    background: var(--surface);
    padding: 30px;
    box-shadow: -10px 0 40px rgba(0,0,0,0.5);
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
  }

  .settings-panel.open { right: 0; }

  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .settings-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .settings-title {
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .settings-close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .settings-close:hover { background: rgba(255,255,255,0.2); }

  .setting-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .setting-label {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .setting-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .setting-input {
    width: 70px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 16px;
    text-align: center;
    transition: border-color 0.2s ease;
    font-family: inherit;
  }

  .setting-input:focus {
    outline: none;
    border-color: var(--tomato);
  }

  .setting-unit {
    color: var(--text-dim);
    font-size: 14px;
  }

  .setting-hint {
    font-size: 12px;
    color: #666;
  }

  .btn-save {
    padding: 12px 24px;
    border-radius: 25px;
    border: none;
    background: var(--tomato);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 1px;
  }

  .btn-save:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 25px rgba(240,128,128,0.4);
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    color: var(--text);
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 30;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .timer-wrapper { width: 280px; height: 280px; }
    .time-text { font-size: 58px; }
    .btn-main { width: 60px; height: 60px; font-size: 26px; }
    .btn-secondary { width: 42px; height: 42px; font-size: 16px; }
    .mode-tab { padding: 8px 16px; font-size: 12px; }
    .settings-panel { width: 100%; right: -100%; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="work">🍅 专注</button>
    <button class="mode-tab" data-mode="shortBreak">☕ 短休息</button>
    <button class="mode-tab" data-mode="longBreak">🧘 长休息</button>
  </div>

  <div class="timer-wrapper">
    <svg class="timer-ring" width="340" height="340" viewBox="0 0 340 340">
      <circle class="ring-bg" cx="170" cy="170" r="155"/>
      <circle class="ring-progress" id="ring" cx="170" cy="170" r="155"
              stroke-dasharray="973.89" stroke-dashoffset="0"/>
    </svg>
    <div class="time-display">
      <div class="time-text" id="timeText">25:00</div>
      <div class="time-label" id="timeLabel">准备开始</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="btnReset" title="重置 (R)">⟲</button>
    <button class="btn btn-main" id="btnMain" title="开始 (空格)">▶</button>
    <button class="btn btn-secondary" id="btnSkip" title="跳过 (S)">⏭</button>
  </div>

  <div class="session-dots">
    <span class="session-label">今日番茄</span>
    <span class="session-dot" id="dot1"></span>
    <span class="session-dot" id="dot2"></span>
    <span class="session-dot" id="dot3"></span>
    <span class="session-dot" id="dot4"></span>
    <span class="session-label" id="sessionCount">0</span>
  </div>
</div>

<button class="settings-toggle" id="btnSettings" title="设置">⚙</button>

<div class="settings-overlay" id="settingsOverlay"></div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">
    ⚙ 设置
    <button class="settings-close" id="btnSettingsClose">✕</button>
  </div>

  <div class="setting-group">
    <span class="setting-label">🍅 专注时长（分钟）</span>
    <div class="setting-row">
      <input class="setting-input" type="number" id="inputWork" value="25" min="1" max="120">
      <span class="setting-unit">分钟</span>
    </div>
  </div>

  <div class="setting-group">
    <span class="setting-label">☕ 短休息时长（分钟）</span>
    <div class="setting-row">
      <input class="setting-input" type="number" id="inputShortBreak" value="5" min="1" max="30">
      <span class="setting-unit">分钟</span>
    </div>
  </div>

  <div class="setting-group">
    <span class="setting-label">🧘 长休息时长（分钟）</span>
    <div class="setting-row">
      <input class="setting-input" type="number" id="inputLongBreak" value="15" min="1" max="60">
      <span class="setting-unit">分钟</span>
    </div>
  </div>

  <div class="setting-group">
    <span class="setting-label">🔔 提示音</span>
    <div class="setting-row">
      <button class="mode-tab active" id="btnSoundOn" style="padding:8px 20px;font-size:13px;">开启</button>
      <button class="mode-tab" id="btnSoundOff" style="padding:8px 20px;font-size:13px;">关闭</button>
    </div>
  </div>

  <button class="btn-save" id="btnSaveSettings">保存设置</button>
  <span class="setting-hint">设置会在下一个周期生效</span>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  // ========== DOM 元素 ==========
  var timeText = document.getElementById('timeText');
  var timeLabel = document.getElementById('timeLabel');
  var ring = document.getElementById('ring');
  var btnMain = document.getElementById('btnMain');
  var btnReset = document.getElementById('btnReset');
  var btnSkip = document.getElementById('btnSkip');
  var sessionCount = document.getElementById('sessionCount');
  var dots = [1,2,3,4].map(function(i) { return document.getElementById('dot' + i); });
  var toast = document.getElementById('toast');
  var tabButtons = document.querySelectorAll('.mode-tab');

  var btnSettings = document.getElementById('btnSettings');
  var btnSettingsClose = document.getElementById('btnSettingsClose');
  var settingsPanel = document.getElementById('settingsPanel');
  var settingsOverlay = document.getElementById('settingsOverlay');
  var btnSaveSettings = document.getElementById('btnSaveSettings');
  var inputWork = document.getElementById('inputWork');
  var inputShortBreak = document.getElementById('inputShortBreak');
  var inputLongBreak = document.getElementById('inputLongBreak');
  var btnSoundOn = document.getElementById('btnSoundOn');
  var btnSoundOff = document.getElementById('btnSoundOff');

  // ========== 状态 ==========
  var CIRCUMFERENCE = 2 * Math.PI * 155;
  ring.style.strokeDasharray = CIRCUMFERENCE;
  ring.style.strokeDashoffset = '0';

  var MODES = {
    work:       { label: '专注工作中…' },
    shortBreak: { label: '休息一下 ☕' },
    longBreak:  { label: '长休息 🧘' },
  };

  var config = {
    work: 25 * 60,
    shortBreak: 5 * 60,
    longBreak: 15 * 60,
    soundEnabled: true,
  };

  var currentMode = 'work';
  var timeRemaining = config.work;
  var totalTime = config.work;
  var timerId = null;
  var isRunning = false;
  var completedPomodoros = 0;

  // ========== 音频 ==========
  var audioCtx = null;

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playBeep(freq, duration, type) {
    type = type || 'sine';
    if (!config.soundEnabled) return;
    try {
      var ctx = getAudioContext();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function playAlarm() {
    if (!config.soundEnabled) return;
    var notes = [880, 1100, 1320];
    notes.forEach(function(freq, i) {
      setTimeout(function() { playBeep(freq, 0.4, 'triangle'); }, i * 200);
    });
  }

  // ========== 通知 ==========
  function requestNotification() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  function showNotification(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body: body, icon: '🍅' });
    }
  }

  requestNotification();

  // ========== Toast ==========
  var toastTimer = null;
  function showToast(msg) {
    if (toastTimer) clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 2500);
  }

  // ========== 辅助函数 ==========
  function pad(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  // ========== UI 更新 ==========
  function updateTimeDisplay() {
    var mins = Math.floor(timeRemaining / 60);
    var secs = timeRemaining % 60;
    timeText.textContent = pad(mins) + ':' + pad(secs);
    document.title = timeText.textContent + ' 🍅 番茄钟';
  }

  function updateRing() {
    var progress = timeRemaining / totalTime;
    var offset = CIRCUMFERENCE * (1 - progress);
    ring.style.strokeDashoffset = offset;
  }

  function updateRingColor() {
    ring.className = 'ring-progress';
    if (currentMode === 'shortBreak') {
      ring.classList.add('break-mode');
    } else if (currentMode === 'longBreak') {
      ring.classList.add('long-break-mode');
    }
  }

  function updateModeTabs() {
    tabButtons.forEach(function(btn) {
      btn.classList.remove('active', 'break-active', 'long-break-active');
      if (btn.dataset.mode === currentMode) {
        if (currentMode === 'shortBreak') {
          btn.classList.add('break-active');
        } else if (currentMode === 'longBreak') {
          btn.classList.add('long-break-active');
        } else {
          btn.classList.add('active');
        }
      }
    });
  }

  function updateDots() {
    var cycleCount = completedPomodoros % 4;
    dots.forEach(function(dot, i) {
      if (i < cycleCount) {
        dot.classList.add('done');
      } else {
        dot.classList.remove('done');
      }
    });
    sessionCount.textContent = completedPomodoros;
  }

  function updateBtnMain() {
    if (isRunning) {
      btnMain.textContent = '⏸';
      btnMain.classList.add('paused');
    } else {
      btnMain.textContent = '▶';
      btnMain.classList.remove('paused');
    }
  }

  function updateLabel() {
    timeLabel.textContent = MODES[currentMode].label;
  }

  function refreshUI() {
    updateTimeDisplay();
    updateRing();
    updateRingColor();
    updateModeTabs();
    updateDots();
    updateBtnMain();
    updateLabel();
  }

  // ========== 计时器核心 ==========
  function startTimer() {
    if (isRunning) return;
    isRunning = true;
    updateBtnMain();

    timerId = setInterval(function() {
      timeRemaining--;
      updateTimeDisplay();
      updateRing();

      if (timeRemaining <= 0) {
        onTimerEnd();
      }
    }, 1000);
  }

  function pauseTimer() {
    if (!isRunning) return;
    isRunning = false;
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
    updateBtnMain();
  }

  function resetTimer() {
    pauseTimer();
    timeRemaining = totalTime;
    refreshUI();
    showToast('⏮ 计时器已重置');
  }

  function onTimerEnd() {
    pauseTimer();
    playAlarm();

    if (currentMode === 'work') {
      completedPomodoros++;
      updateDots();
      showNotification('🍅 番茄钟完成！', '太棒了！已完成 ' + completedPomodoros + ' 个番茄钟。休息一下吧~');
      showToast('🎉 番茄钟完成！已完成 ' + completedPomodoros + ' 个番茄钟');

      if (completedPomodoros % 4 === 0) {
        switchMode('longBreak');
      } else {
        switchMode('shortBreak');
      }
    } else {
      var breakType = currentMode === 'longBreak' ? '长休息' : '短休息';
      showNotification('☕ 休息结束！', '准备开始新的番茄钟吧~');
      showToast('⏰ ' + breakType + '结束，开始新的番茄钟！');
      switchMode('work');
    }
  }

  function switchMode(mode) {
    pauseTimer();
    currentMode = mode;
    totalTime = config[mode];
    timeRemaining = totalTime;
    refreshUI();
  }

  // ========== 按钮事件 ==========
  btnMain.addEventListener('click', function() {
    requestNotification();
    if (isRunning) {
      pauseTimer();
      showToast('⏸ 已暂停');
    } else {
      startTimer();
      if (timeRemaining === totalTime) {
        showToast('▶ 开始计时！');
      } else {
        showToast('▶ 继续计时');
      }
    }
  });

  btnReset.addEventListener('click', function() {
    resetTimer();
  });

  btnSkip.addEventListener('click', function() {
    if (isRunning) pauseTimer();
    if (currentMode === 'work') {
      switchMode('shortBreak');
      showToast('⏭ 已跳转到短休息');
    } else {
      switchMode('work');
      showToast('⏭ 已跳转到工作模式');
    }
  });

  tabButtons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var mode = btn.dataset.mode;
      if (mode === currentMode && timeRemaining === totalTime && !isRunning) return;
      switchMode(mode);
      var modeNames = { work: '🍅 专注', shortBreak: '☕ 短休息', longBreak: '🧘 长休息' };
      showToast('已切换到 ' + modeNames[mode] + ' 模式');
    });
  });

  // ========== 设置面板 ==========
  function openSettings() {
    inputWork.value = Math.round(config.work / 60);
    inputShortBreak.value = Math.round(config.shortBreak / 60);
    inputLongBreak.value = Math.round(config.longBreak / 60);
    updateSoundButtons();
    settingsPanel.classList.add('open');
    settingsOverlay.classList.add('show');
  }

  function closeSettings() {
    settingsPanel.classList.remove('open');
    settingsOverlay.classList.remove('show');
  }

  function updateSoundButtons() {
    if (config.soundEnabled) {
      btnSoundOn.classList.add('active');
      btnSoundOff.classList.remove('active');
    } else {
      btnSoundOff.classList.add('active');
      btnSoundOn.classList.remove('active');
    }
  }

  btnSettings.addEventListener('click', openSettings);
  btnSettingsClose.addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', closeSettings);

  btnSoundOn.addEventListener('click', function() {
    config.soundEnabled = true;
    updateSoundButtons();
  });

  btnSoundOff.addEventListener('click', function() {
    config.soundEnabled = false;
    updateSoundButtons();
  });

  btnSaveSettings.addEventListener('click', function() {
    var workMin = Math.max(1, Math.min(120, parseInt(inputWork.value) || 25));
    var shortMin = Math.max(1, Math.min(30, parseInt(inputShortBreak.value) || 5));
    var longMin = Math.max(1, Math.min(60, parseInt(inputLongBreak.value) || 15));

    config.work = workMin * 60;
    config.shortBreak = shortMin * 60;
    config.longBreak = longMin * 60;

    inputWork.value = workMin;
    inputShortBreak.value = shortMin;
    inputLongBreak.value = longMin;

    if (!isRunning) {
      totalTime = config[currentMode];
      timeRemaining = totalTime;
      refreshUI();
    }

    closeSettings();
    showToast('✅ 设置已保存');
  });

  // ========== 键盘快捷键 ==========
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        btnMain.click();
        break;
      case 'KeyR':
        if (!e.ctrlKey && !e.metaKey) btnReset.click();
        break;
      case 'KeyS':
        if (!e.ctrlKey && !e.metaKey) btnSkip.click();
        break;
    }
  });

  // ========== 初始化 ==========
  totalTime = config.work;
  timeRemaining = totalTime;
  refreshUI();

  document.addEventListener('click', function() {
    try { getAudioContext(); } catch (e) {}
  }, { once: true });

  console.log('🍅 番茄钟已就绪');
  console.log('  空格键 — 开始/暂停');
  console.log('  R 键  — 重置');
  console.log('  S 键  — 跳过');
  console.log('  点击右上角 ⚙ — 设置');
})();
</script>
</body>
</html>
